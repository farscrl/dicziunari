<ion-item-sliding #slidingItem>
  <ion-item>
    <ion-grid>
      @if ((searchDirection === 'fromDe') || (searchDirection === 'both' && selectedLocale === 'de')) {
        <ion-row>
          <ion-col>
            <app-result-text [text]="lemma.DStichwort" [flex]="lemma.DFlex" [grammar]="dGramm" class="first-col"
                             [semantics]="lemma.DSempraez" [searchString]="searchString" (changeSearchTerm)="changeTerm($event)"></app-result-text>
          </ion-col>
          <ion-col size="auto" class="verb" (click)="goToDetail()">
            <ion-icon src="assets/icon/info.svg" size="large" [style.visibility]="hasInflection ? 'visible' : 'hidden'"></ion-icon>
          </ion-col>
          <ion-col>
            <app-result-text [text]="lemma.RStichwort" [flex]="lemma.RFlex" [grammar]="rGramm" class="second-col"
                             [semantics]="lemma.RSempraez" [searchString]="searchDirection === 'both' ? searchString : ''" [pronunciation]="lemma.RPronunciation" (changeSearchTerm)="changeTerm($event)">
            </app-result-text>
          </ion-col>
        </ion-row>
      }
      @if ((searchDirection === 'fromRm') || (searchDirection === 'both' && selectedLocale === 'rm')) {
        <ion-row>
          <ion-col>
            <app-result-text [text]="lemma.RStichwort" [flex]="lemma.RFlex" [grammar]="rGramm" class="first-col"
                             [semantics]="lemma.RSempraez" [searchString]="searchString" [pronunciation]="lemma.RPronunciation" (changeSearchTerm)="changeTerm($event)"></app-result-text>
          </ion-col>
          <ion-col size="auto" class="verb" (click)="goToDetail()">
            <ion-icon src="assets/icon/info.svg" size="large" [style.visibility]="hasInflection ? 'visible' : 'hidden'"></ion-icon>
          </ion-col>
          <ion-col>
            <app-result-text [text]="lemma.DStichwort" [flex]="lemma.DFlex" [grammar]="dGramm" class="second-col"
                             [semantics]="lemma.DSempraez" [searchString]="searchDirection === 'both' ? searchString : ''" (changeSearchTerm)="changeTerm($event)">
            </app-result-text>
          </ion-col>
        </ion-row>
      }
    </ion-grid>
</ion-item>

<ion-item-options side="end">
  <div>
    @if (isSaved) {
      <ion-item-option color="white" size="small" (click)="deleteFavourite(slidingItem);">
        <ion-icon src="assets/icon/save-remove.svg" slot="icon-only" class="delete"></ion-icon>
      </ion-item-option>
    }
    @if (!isSaved) {
      <ion-item-option color="white" size="small" (click)="addFavorite(slidingItem);">
        <ion-icon src="assets/icon/save.svg" slot="icon-only" class="save"></ion-icon>
      </ion-item-option>
    }
    <ion-item-option color="white" size="small" (click)="copy(slidingItem)">
      <ion-icon src="assets/icon/copy.svg" slot="icon-only" class="copy"></ion-icon>
    </ion-item-option>
    <ion-item-option color="white" size="small" (click)="share(slidingItem)">
      <ion-icon src="assets/icon/share.svg" slot="icon-only" class="copy"></ion-icon>
    </ion-item-option>
  </div>
</ion-item-options>
</ion-item-sliding>
